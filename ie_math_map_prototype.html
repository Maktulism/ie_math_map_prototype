<style>
:root{--bg1:#f4e6c9;--bg2:#e2c89a;--ink:#2b2622;--sub:#6d6558;--panel:rgba(251,246,232,.9);--line:rgba(43,38,34,.22);--accent:#a8431c;--pill:rgba(251,246,232,.97);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1a1048;--bg2:#04030f;--ink:#e9f6ff;--sub:#9fb3ff;--panel:rgba(10,8,38,.72);--line:rgba(25,240,255,.26);--accent:#19f0ff;--pill:rgba(8,6,30,.94)}}
:root[data-theme="dark"]{--bg1:#1a1048;--bg2:#04030f;--ink:#e9f6ff;--sub:#9fb3ff;--panel:rgba(10,8,38,.72);--line:rgba(25,240,255,.26);--accent:#19f0ff;--pill:rgba(8,6,30,.94)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:radial-gradient(ellipse at 50% 30%,var(--bg1),var(--bg2));color:var(--ink);overflow:hidden;touch-action:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;font-size:10.5px;font-weight:500;background:var(--pill);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:1px 7px;white-space:nowrap;box-shadow:0 2px 8px rgba(30,20,100,.18);display:none}
.lb.on{background:var(--accent);color:#fff;border-color:transparent;z-index:5}
.lb.pk{display:block;pointer-events:none;font-weight:800}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg1);font-size:12px;padding:3px 10px;border-radius:8px;opacity:0;transition:opacity .15s;z-index:9;white-space:nowrap}
header{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-start:16px;width:300px;z-index:8}
h1{font-size:32px;font-weight:800;margin:0;line-height:1.15}
header p{margin:4px 0 10px;color:var(--sub);font-size:12.5px}
.glass{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 8px 30px rgba(30,20,100,.14)}
.in{width:100%;font:inherit;font-size:13px;color:var(--ink);padding:9px 14px;border-radius:14px;outline:none;background:var(--panel)}
.in:focus-visible{border-color:var(--accent)}
#res{margin-top:6px;border-radius:14px;overflow:hidden;display:none}
#res button,#li button{display:block;width:100%;text-align:start;font:inherit;font-size:12.5px;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);padding:7px 12px;cursor:pointer}
#res button:hover,#li button:hover{background:var(--line)}
small{color:var(--sub);margin-inline-start:6px;font-size:10.5px}
#lst{position:fixed;inset-inline-start:16px;top:150px;width:300px;max-height:calc(100vh - 440px);min-height:150px;border-radius:16px;display:none;flex-direction:column;z-index:4;overflow:hidden}
#lh{padding:10px 14px 6px;font-size:13px;font-weight:800}
#lh span{display:block;font-weight:300;font-size:11px;color:var(--sub);margin-top:2px;line-height:1.6}
#lst .in{border-radius:0;border:0;border-block:1px solid var(--line);padding:7px 14px;font-size:12px}
#li{overflow:auto;flex:1}
#li h4{margin:0;padding:6px 14px;font-size:11px;font-weight:500;color:var(--accent);background:var(--line);position:sticky;top:0}
aside{position:fixed;inset-inline-end:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:5px;width:176px;max-height:88vh;overflow:auto;scrollbar-width:none}
aside h3{margin:8px 4px 0;font-size:12px;color:var(--sub);font-weight:500}
.chip{display:flex;align-items:center;gap:9px;border-radius:12px;padding:7px 11px;font:inherit;font-size:12px;color:var(--ink);cursor:pointer;text-align:start}
.chip i{width:12px;height:12px;border-radius:4px;flex:none}
.chip.on{outline:2px solid var(--accent)}
#info{position:fixed;inset-inline-start:16px;bottom:calc(34px + env(safe-area-inset-bottom,0px));width:300px;border-radius:20px;padding:14px 16px}
#info b{font-size:17px;display:block}
#info span{color:var(--sub);font-size:12px}
#ph{margin-top:10px;height:80px;border-radius:12px;display:grid;place-items:center;font-size:12px;color:var(--sub);background:repeating-linear-gradient(135deg,transparent 0 10px,var(--line) 10px 11px);border:1px dashed var(--line)}
.row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn{flex:1;font:inherit;font-size:11.5px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:7px 4px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--line)}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--accent)}
#credit{position:fixed;inset-inline-end:16px;bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:11.5px;color:var(--sub);pointer-events:none}
@media(max-width:700px){aside{inset-inline-end:8px;left:8px;top:auto;bottom:calc(220px + env(safe-area-inset-bottom,0px));transform:none;width:auto;max-height:26vh;flex-direction:row;flex-wrap:wrap}aside h3{width:100%}#info{width:auto;inset-inline-end:16px}#ph{height:50px}h1{font-size:24px}header{width:auto;inset-inline-end:16px}header p{display:none}#lst{inset-inline-end:16px;width:auto;top:96px;max-height:30vh}#credit{inset-inline-start:16px;inset-inline-end:auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
*{-webkit-tap-highlight-color:transparent}#lt{display:none}
.neon body{background:radial-gradient(ellipse at 85% 0%,rgba(255,43,214,.3),transparent 46%),radial-gradient(ellipse at 8% 8%,rgba(25,240,255,.24),transparent 42%),radial-gradient(ellipse at 50% 35%,var(--bg1),var(--bg2))}
.neon h1{background:linear-gradient(90deg,#19f0ff,#ff2bd6);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(255,43,214,.45))}
.neon .glass{border-color:rgba(25,240,255,.3);box-shadow:0 0 22px rgba(25,240,255,.14),0 0 40px rgba(255,43,214,.08)}
.neon .chip.on{outline-color:#ff2bd6;box-shadow:0 0 14px rgba(255,43,214,.5)}
.neon .lb{border-color:rgba(255,43,214,.55);box-shadow:0 0 10px rgba(255,43,214,.4)}
.neon .lb.on,.neon #cf button.on{background:linear-gradient(90deg,#ff2bd6,#19f0ff);color:#06041a}
.se-autumn{--bg1:#ffe9c4;--bg2:#ffb877;--accent:#d4471a}
.se-autumn.sk body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 86% 7%,rgba(255,226,140,.85),transparent 36%),radial-gradient(ellipse at 12% 105%,rgba(214,80,30,.3),transparent 58%)}.se-winter{--bg1:#f2f6f9;--bg2:#d6e1ea;--accent:#3a6f9e}.se-spring{--bg1:#f3f1dc;--bg2:#dfe9c8;--accent:#c24f7c}.se-summer{--bg1:#f8eec8;--bg2:#ecd99a;--accent:#2e7d4a}
.sk body{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .28 0 0 0 0 .2 0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.28'/></svg>"),radial-gradient(ellipse at 50% 30%,var(--bg1),var(--bg2));background-blend-mode:multiply,normal}
.sk body::after{content:'';position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 150px rgba(160,80,20,.12);z-index:1}
.se-summer.sk body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 92% 6%,rgba(255,214,90,.55),transparent 34%)}
.sk .glass{background:rgba(251,246,232,.9);border:1.6px solid #2b2622;border-radius:14px 6px 12px 7px/7px 12px 6px 14px;box-shadow:3px 3px 0 rgba(43,38,34,.28);backdrop-filter:none;-webkit-backdrop-filter:none}
.sk .lb{background:#fbf6e8;border:1.4px solid #2b2622;border-radius:6px 3px 7px 3px;box-shadow:2px 2px 0 rgba(43,38,34,.3);color:#2b2622}
.sk .lb.on{background:var(--accent);color:#fff}.sk h1{text-shadow:2px 2px 0 rgba(43,38,34,.14)}
#cf{display:flex;flex:none;gap:5px;padding:6px 12px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}#cf button{flex:none;border:0;border-radius:999px;padding:3px 10px;font:inherit;font-size:11px;background:var(--line);color:inherit;cursor:pointer;white-space:nowrap}#cf button.on{background:var(--accent);color:#fff}
.row{flex-wrap:wrap}
#cmp{position:fixed;top:10px;left:12px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;z-index:3;pointer-events:none;background:var(--pill,rgba(255,255,255,.75));border:1px solid var(--line);font-size:9px;line-height:1.1;text-align:center;color:var(--accent)}.in{user-select:text;-webkit-user-select:text}#li,#res{touch-action:pan-y;overscroll-behavior:contain}
@media(max-width:700px){
header{top:calc(8px + env(safe-area-inset-top,0px));inset-inline-start:10px;inset-inline-end:10px;width:auto}
h1{font-size:20px}header p{display:none}
.in{font-size:16px;padding:8px 12px}
.glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--pill)}
#res{max-height:38dvh;overflow:auto}
aside{left:0;right:0;inset-inline-end:0;top:calc(90px + env(safe-area-inset-top,0px));bottom:auto;transform:none;width:auto;max-height:none;flex-direction:row;flex-wrap:nowrap;align-items:center;overflow-x:auto;overflow-y:hidden;padding:2px 10px;gap:6px;touch-action:pan-x;overscroll-behavior:contain}
aside h3{width:auto;flex:none;margin:0 4px;white-space:nowrap}
.chip{flex:none;white-space:nowrap;padding:6px 10px}
#lst{inset-inline-start:10px;inset-inline-end:10px;width:auto;top:calc(136px + env(safe-area-inset-top,0px));min-height:110px;max-height:min(34dvh,calc(100dvh - 430px))}
#lh span{display:none}#lh{padding:8px 12px 4px}
#info{inset-inline-start:10px;inset-inline-end:10px;width:auto;bottom:calc(26px + env(safe-area-inset-bottom,0px));padding:10px 12px;border-radius:16px}
#info b{font-size:15px}#info span{font-size:11px}
#ph{height:44px;margin-top:6px}.row{margin-top:6px;gap:4px}
.btn{font-size:10.5px;white-space:normal;padding:6px 2px}
.lb{font-size:9.5px;padding:1px 5px}
#credit{font-size:10px;bottom:calc(6px + env(safe-area-inset-bottom,0px))}
#cmp{top:auto;left:10px;bottom:calc(215px + env(safe-area-inset-bottom,0px))}
#lt{position:fixed;inset-inline-start:10px;top:calc(136px + env(safe-area-inset-top,0px));z-index:5;flex:none;width:auto;padding:7px 14px;border-radius:12px;font-size:12px;color:var(--ink)}
}

#cf{display:none!important}</style>

// ---- ورودی و کلیک روی اتاق‌های طبقه‌ی انتخاب‌شده
const pts=new Map(),ray=new THREE.Raycaster(),mv=new THREE.Vector2(),tip=document.getElementById('tip');let pd=0,pa=null,down=null;
const clampR=v=>Math.min(110,Math.max(14,v));
cvs.addEventListener('pointerdown',e=>{cvs.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);down=[e.clientX,e.clientY];if(pts.size===2){const[a,b]=[...pts.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1]);pa=null}auto=false});
function hit(x,y){if(!focus)return null;mv.set(x/innerWidth*2-1,-y/innerHeight*2+1);ray.setFromCamera(mv,cam);const h=ray.intersectObjects(focus.tiles,false)[0];return h?h.object.userData.q:null}
cvs.addEventListener('pointermove',e=>{
 if(!pts.has(e.pointerId)){if(e.pointerType!=='mouse')return;const q=hit(e.clientX,e.clientY);
  if(hov&&hov!==q&&hov!==sel)hov.mat.emissive.setHex(hov.eh0);
  if(q&&q!==hov&&q!==sel){q.eh0=q.mat.emissive.getHex();q.mat.emissive.setHex(q.f.c)}
  hov=q;cvs.style.cursor=q?'pointer':'grab';tip.style.opacity=q?1:0;if(q){tip.textContent=q.title;tip.style.left=e.clientX+14+'px';tip.style.top=e.clientY+14+'px'}return}
 const p=pts.get(e.pointerId);
 if(pts.size===1){const dx=e.clientX-p[0],dy=e.clientY-p[1];
 if(e.pointerType==='mouse'&&((e.buttons&2)||e.shiftKey)){thT-=dx*.006;phT=Math.min(1.5,Math.max(.2,phT-dy*.005))}
 else{if(lockQ){const b=baseT();panX=tg.x-b[0];panZ=tg.z-b[1];lockQ=null}
  const k=rad*.0017,c=Math.cos(th),s=Math.sin(th);panX=Math.max(-60,Math.min(60,panX-(c*dx+s*dy)*k));panZ=Math.max(-40,Math.min(40,panZ-(-s*dx+c*dy)*k))}}
 pts.set(e.pointerId,[e.clientX,e.clientY]);
 if(pts.size===2){const[a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);radT=clampR(radT*pd/d);pd=d;const an=Math.atan2(b[1]-a[1],b[0]-a[0]);if(pa!==null){let da=an-pa;if(da>Math.PI)da-=2*Math.PI;if(da<-Math.PI)da+=2*Math.PI;thT+=da}pa=an}});
['pointerup','pointercancel'].forEach(n=>cvs.addEventListener(n,e=>{
 if(n==='pointerup'&&down&&Math.hypot(e.clientX-down[0],e.clientY-down[1])<5){const q=hit(e.clientX,e.clientY);if(q)pick(q);else if(sel)pick(null)}
 pts.delete(e.pointerId);down=null}));
cvs.addEventListener('contextmenu',e=>e.preventDefault());cvs.addEventListener('wheel',e=>{e.preventDefault();radT=clampR(radT*(1+e.deltaY*.001))},{passive:false});
function size(){const w=innerWidth,h=innerHeight;ren.setSize(w,h,false);cam.aspect=w/h;cam.fov=w/h<1?Math.min(62,34*Math.pow(h/w,.55)):34;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();
const v=new THREE.Vector3(),ease=x=>1-Math.pow(1-x,3);
function loop(t){
 requestAnimationFrame(loop);
 const ip=ease(Math.min(1,(t-t0)/3200));
 {const dtm=lastT?t-lastT:16;lastT=t;ema=ema*.92+Math.min(dtm,100)*.08;if(t>4000&&ema>27&&curPR>.85){curPR=Math.max(.85,curPR-.2);ren.setPixelRatio(curPR);size();ema=16}}
 if(auto)thT+=.003;ex+=(exT-ex)*.05;if(Math.abs(exT-ex)>.002||ip<1)sh=3;if(sh>0){ren.shadowMap.needsUpdate=true;sh--}
 const sp=1.3+3.2*ex;
 th+=(thT-th)*.1;ph+=(phT-ph)*.1;rad+=(radT-rad)*.08;
 FL.forEach(f=>{f.group.position.y=f.lvl*sp;if(f.signs)f.signs.forEach(s=>s.visible=!focus);
  const o=!focus||focus===f?1:.08;f.o=f.o===undefined?1:f.o;if(Math.abs(o-f.o)>.002){f.o+=(o-f.o)*.12;sh=3;f.mats.forEach(m=>m.opacity=m.userData.base*f.o)}});
ru.t.value=t*.001;pu.t.value=t*.001;window.ANU&&ANU(t);window.FXU&&FXU(t);
FLT.forEach(([g,k])=>{g.scale.y=sp;g.visible=!focus||focus.lvl===k||focus.lvl===k+1});env.position.y=-.35;
 if(lockQ){lockQ.anchor.getWorldPosition(v);tgT.copy(v)}else{const b=baseT();tgT.set(b[0]+panX,(focus?focus.lvl*sp:1*sp)+1,b[1]+panZ)}
 tg.lerp(tgT,.08);
 if(sel&&sel.anchor){sel.anchor.getWorldPosition(v);pin.position.set(v.x,v.y+1.1+Math.sin(t*.006)*.15,v.z);pin.visible=true}else pin.visible=false;
 const R=rad*(1+(1-ip)*.9),P=ph-(1-ip)*.55,Th=th-(1-ip)*1.3;
 cam.position.set(tg.x+Math.sin(Th)*Math.sin(P)*R,tg.y+Math.cos(P)*R,tg.z+Math.cos(Th)*Math.sin(P)*R);cam.lookAt(tg);cmp.style.transform='rotate('+Th+'rad)';
 ren.render(scene,cam);
 const w=innerWidth,h=innerHeight,place=(q,show)=>{q.el.style.display=show?'block':'none';if(show)q.el.style.transform='translate('+(v.x*.5+.5)*w+'px,'+((-v.y*.5+.5)*h-(q.off||0))+'px) translate(-50%,-50%)'};
 if(focus&&ip>.6)focus.recs.forEach(q=>{q.anchor.getWorldPosition(v);v.project(cam);place(q,v.z<1&&vis(q)&&(innerWidth>700||q===sel))});
STL.forEach(q=>{q.anchor.getWorldPosition(v);v.project(cam);place(q,v.z<1&&ip>.6&&!focus)});
}
requestAnimationFrame(loop);
